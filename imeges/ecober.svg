<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90">
  <rect width="300" height="90" fill="white"/>

  <!-- "ec" part -->
  <text x="12" y="52"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-weight="900" font-size="42" fill="#1A2B5E" letter-spacing="-0.5">ec</text>

  <!-- "o" ring drawn manually so the red dot is perfectly centred -->
  <!-- Arial Black 42px: "ec" ~ 12+25+23 = 60 ; "o" width ~27, center x=73 -->
  <circle cx="73" cy="34" r="16" fill="none" stroke="#1A2B5E" stroke-width="5.5"/>
  <circle cx="73" cy="34" r="5.5" fill="#D42229"/>

  <!-- "ber" part — starts where the "o" ring ends -->
  <text x="90" y="52"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-weight="900" font-size="42" fill="#1A2B5E" letter-spacing="-0.5">ber</text>

  <!-- Red underline -->
  <rect x="12" y="61" width="240" height="2.8" fill="#D42229" rx="1.4"/>

  <!-- Tagline -->
  <text x="12" y="79"
        font-family="Arial,Helvetica,sans-serif"
        font-size="9" fill="#6B7280" letter-spacing="1.6" font-weight="600">GLOBAL BRANDS IN ONE TEAM</text>
</svg>
