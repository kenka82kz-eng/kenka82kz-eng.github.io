<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 105">
  <!-- Tilted red parallelogram -->
  <polygon points="18,6 278,0 284,76 8,82" fill="#E8001F" rx="10"/>
  <!-- Rounded corners via clipPath -->
  <defs>
    <clipPath id="pc"><polygon points="18,6 278,0 284,76 8,82"/></clipPath>
  </defs>
  <rect x="8" y="0" width="278" height="84" rx="10" fill="#E8001F" clip-path="url(#pc)"/>
  <!-- jaqyn text -->
  <text x="150" y="62" text-anchor="middle"
    font-family="'Arial Rounded MT Bold','Nunito','Trebuchet MS',Arial,sans-serif"
    font-weight="900" font-size="52" fill="white" letter-spacing="-1">jaqyn</text>
  <!-- subtitle -->
  <text x="150" y="100" text-anchor="middle"
    font-family="Arial,sans-serif" font-size="12" fill="#444" letter-spacing="1.5">duken · магазин · mart</text>
</svg>
