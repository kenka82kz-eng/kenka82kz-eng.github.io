<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 82">
  <!-- transparent background -->

  <!-- "ec" -->
  <text x="10" y="46"
        font-family="'Arial','Helvetica Neue',Helvetica,sans-serif"
        font-weight="700" font-size="36" fill="#1A2B5E" letter-spacing="0.3">ec</text>

  <!-- "o" drawn as ring + globe dots (centre ≈ x=82, y=30) -->
  <!-- Outer ring -->
  <circle cx="82" cy="30" r="15.5" fill="none" stroke="#1A2B5E" stroke-width="4.5"/>
  <!-- Left blue dot -->
  <circle cx="76" cy="27" r="4.8" fill="#2563EB"/>
  <!-- Right orange-red dot -->
  <circle cx="88" cy="33" r="4.8" fill="#D42229"/>

  <!-- "ber" -->
  <text x="98" y="46"
        font-family="'Arial','Helvetica Neue',Helvetica,sans-serif"
        font-weight="700" font-size="36" fill="#1A2B5E" letter-spacing="0.3">ber</text>

  <!-- ® trademark -->
  <text x="192" y="24"
        font-family="Arial,sans-serif"
        font-size="10" fill="#1A2B5E" font-weight="400">®</text>

  <!-- Red underline -->
  <rect x="10" y="53" width="198" height="2.8" fill="#D42229" rx="1.4"/>

  <!-- Tagline -->
  <text x="10" y="71"
        font-family="Arial,Helvetica,sans-serif"
        font-size="8.5" fill="#6B7280" letter-spacing="1.5" font-weight="600">GLOBAL BRANDS IN ONE TEAM</text>
</svg>
