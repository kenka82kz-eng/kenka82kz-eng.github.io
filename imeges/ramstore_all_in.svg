<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <rect width="400" height="280" fill="white" rx="12"/>

  <!-- "Ramstore" orange bold top text -->
  <text x="200" y="90" text-anchor="middle"
    font-family="'Arial Black','Impact',Arial,sans-serif"
    font-weight="900" font-size="62" fill="#F04B00" letter-spacing="-1">Ramstore</text>

  <!-- Left downward triangles (2 stacked chevrons) -->
  <polygon points="22,140 54,113 86,140" fill="#F04B00"/>
  <polygon points="22,175 54,148 86,175" fill="#F04B00"/>

  <!-- "ALL" large dark navy -->
  <text x="200" y="210" text-anchor="middle"
    font-family="'Arial Black','Impact',Arial,sans-serif"
    font-weight="900" font-size="108" fill="#1A1E6A">ALL</text>

  <!-- "in" orange, beside ALL -->
  <text x="315" y="210" text-anchor="start"
    font-family="'Arial Black','Impact',Arial,sans-serif"
    font-weight="900" font-size="68" fill="#F04B00">in</text>

  <!-- Right downward triangles (2 stacked chevrons) -->
  <polygon points="314,140 346,113 378,140" fill="#F04B00"/>
  <polygon points="314,175 346,148 378,175" fill="#F04B00"/>
</svg>
