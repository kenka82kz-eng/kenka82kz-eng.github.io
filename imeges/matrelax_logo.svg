  <ellipse cx="60" cy="60" rx="42" ry="32" fill="#5BBFB5"/>
  <ellipse cx="140" cy="60" rx="42" ry="32" fill="#5BBFB5"/>
  <ellipse cx="100" cy="52" rx="50" ry="34" fill="#5BBFB5"/>

  <!-- Sleeping figure (simplified) -->
  <!-- Head -->
  <circle cx="68" cy="62" r="10" fill="#F5DEB3"/>
  <!-- Hair flowing -->
  <ellipse cx="62" cy="60" rx="12" ry="8" fill="#8B4513" opacity="0.8"/>
  <!-- Body lying down -->
